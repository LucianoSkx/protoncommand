name: Release AppImage

# Criar e enviar uma tag v* (ex.: git tag v0.5.0 && git push origin v0.5.0)
# gera o AppImage e publica o GitHub Release automaticamente.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules (com retry)
        run: |
          for i in 1 2 3 4 5; do
            go mod download ./... && break
            echo "download falhou (tentativa $i/5)"
            [ "$i" = 5 ] && exit 1
            sleep $((i * 15))
          done

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VERSION: ${{ github.ref_name }}
        run: |
          bash build-appimage.sh "${VERSION#v}"

      - name: Prepare release notes from CHANGELOG
        id: notes
        run: |
          python3 - <<'PY'
          import re, subprocess
          tag = "${{ github.ref_name }}"
          body = ""
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              parts = re.split(r"\n# ", "\n" + text)
              for p in parts:
                  if p.strip().startswith(tag):
                      body = p.strip()
                      break
          except FileNotFoundError:
              pass
          if not body:
              prev = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD^"],
                  capture_output=True, text=True,
              ).stdout.strip()
              rng = f"{prev}..HEAD" if prev else "HEAD"
              log = subprocess.run(
                  ["git", "log", "--pretty=format=- %s", rng],
                  capture_output=True, text=True,
              ).stdout.strip()
              body = f"# {tag}\n\n## Commits\n" + (log or "(sem commits)")
          open("release_body.md", "w", encoding="utf-8").write(body)
          print(body[:200])
          PY

      - name: List artifacts
        run: ls -lh dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            dist/protoncommand-*.AppImage
            dist/protoncommand-*.AppImage.zsync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
